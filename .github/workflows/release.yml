name: CI/CD Pipeline

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  issues:
    types: [ opened ]

permissions:
  contents: read

jobs:
  quality-check:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v') || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - uses: astral-sh/setup-uv@v10.4.0
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: card/package-lock.json
    - name: Install
      run: |
        uv pip install --system '.[dev]'
        npm --prefix card ci
    - name: Quality check
      run: python scripts/quality_check.py

  release:
    needs: quality-check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) ||
      (github.event_name == 'issues' &&
       github.event.action == 'opened' &&
       github.event.sender.login == 'phiprosoft' &&
       startsWith(github.event.issue.title, 'Release v') &&
       github.event.issue.body == 'APPROVE RELEASE')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Determine release tag
      id: release_tag
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
      run: |
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          VERSION=$(jq -r .version custom_components/electricity_lens/manifest.json)
          TAG="v$VERSION"
        elif [ "$EVENT_NAME" = "issues" ]; then
          if [[ "$ISSUE_TITLE" =~ ^Release[[:space:]]v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            TAG="v${BASH_REMATCH[1]}"
          else
            echo "::error::Issue title must match 'Release vX.Y.Z'"
            exit 1
          fi
        else
          TAG="$REF_NAME"
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
    - name: Check that the manifest version matches the tag
      env:
        TAG: ${{ steps.release_tag.outputs.tag }}
      run: test "v$(jq -r .version custom_components/electricity_lens/manifest.json)" = "$TAG"
    - name: Read Release Notes
      id: release_notes
      env:
        TAG: ${{ steps.release_tag.outputs.tag }}
      run: |
        NOTES_FILE="release-notes/${TAG}.md"
        if [ -f "$NOTES_FILE" ]; then
          NOTES=$(cat "$NOTES_FILE")
        else
          echo "::error::Missing $NOTES_FILE"
          exit 1
        fi
        DELIMITER="RELEASE_NOTES_$(date +%s%N)"
        {
          echo "body<<${DELIMITER}"
          echo "$NOTES"
          echo "${DELIMITER}"
        } >> "$GITHUB_OUTPUT"
    - name: Create and push annotated tag
      if: github.event_name == 'workflow_dispatch' || github.event_name == 'issues'
      env:
        TAG: ${{ steps.release_tag.outputs.tag }}
      run: |
        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
          echo "::error::Tag $TAG already exists. Use the existing tag-triggered release instead."
          exit 1
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "$TAG" -m "Release $TAG"
        git push origin "$TAG"
    - name: GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.release_tag.outputs.tag }}
        body: ${{ steps.release_notes.outputs.body }}
        generate_release_notes: false
